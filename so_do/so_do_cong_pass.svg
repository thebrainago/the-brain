<text x="380.0" y="679.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">6 ĐIỀU KIỆN PASS — ĐỒNG THỜI</text>
<text x="380.0" y="714" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">1. net_return &gt; buyhold_net_return</text>
<text x="380.0" y="734" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">2. net_sharpe &gt; buyhold_net_sharpe (không phải do</text>
<text x="380.0" y="751" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">liều cao hơn)</text>
<text x="380.0" y="771" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">3. net_calmar &gt; buyhold_net_calmar (không phải do ôm</text>
<text x="380.0" y="788" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">sụt giảm)</text>
<text x="380.0" y="808" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">4. alpha_vs_buyhold &gt; 0, p ≤ ngưỡng (Newey-West —</text>
<text x="380.0" y="825" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">chặn đòn bẩy trá hình)</text>
<text x="380.0" y="845" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">5. placebo_p ≤ ngưỡng — p XẤU NHẤT trong ≥ 5 hạt null</text>
<text x="380.0" y="865" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">6. pre_registered = true</text>
<rect x="680.0" y="701" width="300" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
<rect x="680.0" y="667" width="300" height="34" rx="10" fill="#334155" stroke="#334155" stroke-width="0"/>
