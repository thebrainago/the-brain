<text x="380.0" y="223.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">ĐÃ ĐĂNG KÝ TRƯỚC + plan_hash? (quyết định)</text>
<text x="380.0" y="258" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="normal">plan_hash bắt buộc ở tầng dữ liệu → bắt chạy chui,</text>
<text x="380.0" y="275" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="normal">không chỉ bắt sửa file</text>
<text x="380.0" y="295" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">KHÔNG → tối đa EXPLORATORY, không bao giờ PASS</text>
