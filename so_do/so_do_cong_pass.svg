<text x="380.0" y="510.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">COST MODEL ĐỐI XỨNG 2 VẾ? (quyết định)</text>
<text x="380.0" y="545" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="normal">Chiến lược và mốc phải dùng CÙNG hàm chi phí trên</text>
<text x="380.0" y="562" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="normal">cùng chuỗi phơi nhiễm</text>
<text x="380.0" y="582" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="normal">Mốc = cách RẺ NHẤT có cùng phơi nhiễm theo lớp tài</text>
<text x="380.0" y="599" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="normal">sản (ETF ~0,1%/năm cho chỉ số)</text>
<text x="380.0" y="619" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">KHÔNG → TỪ CHỐI — bài học Vòng 6 (63% “edge” giả)</text>
