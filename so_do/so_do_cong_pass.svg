<text x="830.0" y="689.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">SIẾT THÊM KHI EXPOSURE &gt; 95%</text>
<text x="692.0" y="725" font-size="14" fill="#475569" text-anchor="start" font-weight="normal">alpha &amp; placebo p ≤ 0,01 + ≥1</text>
<text x="692.0" y="739" font-size="14" fill="#475569" text-anchor="start" font-weight="normal">giai đoạn con dương</text>
<text x="692.0" y="756" font-size="14" fill="#475569" text-anchor="start" font-weight="normal">Lý do: cơ chế VIX IC +0,106</text>
<text x="692.0" y="770" font-size="14" fill="#475569" text-anchor="start" font-weight="normal">nhưng placebo 10,2% — gần như</text>
<text x="692.0" y="784" font-size="14" fill="#475569" text-anchor="start" font-weight="normal">là mua-giữ</text>
