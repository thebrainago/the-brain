<text x="380.0" y="1254.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">SONG SÓT — KẾT LUẬN ĐƯỢC KÝ</text>
<text x="380.0" y="1289" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="normal">Hạn dùng 3/6/12 tháng (hạng C/B/A) · tái kiểm quý</text>
<text x="380.0" y="1306" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="normal">bằng lịch Lan-DeMets</text>
<text x="380.0" y="1326" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="normal">Không cộng FDR cho bảo trì · hết hạn = quay lại từ</text>
<text x="380.0" y="1343" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="normal">đầu</text>
<text x="380.0" y="1367" font-size="17" fill="#475569" text-anchor="middle" font-weight="normal">Hiện tại: 0 song sót / 324 — quá nhiều</text>
<text x="380.0" y="1384" font-size="17" fill="#475569" text-anchor="middle" font-weight="normal">PASS/ngày là tín hiệu HỎNG dây chuyền</text>
