<text x="380.0" y="1137" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="normal">Ngưỡng tính trên TOÀN BỘ 324 phép thử tích lũy, không</text>
<text x="380.0" y="1154" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="normal">phải riêng lần chạy</text>
<text x="380.0" y="1178" font-size="17" fill="#475569" text-anchor="middle" font-weight="normal">Thêm giả thuyết = tự động siết ngưỡng</text>
<text x="380.0" y="1195" font-size="17" fill="#475569" text-anchor="middle" font-weight="normal">cho tất cả</text>
