<text x="380.0" y="916.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">PLACEBO + WALK-FORWARD + THỜI ĐẠI</text>
<text x="380.0" y="951" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="normal">Null factory: block bootstrap theo chính chuỗi vào</text>
<text x="380.0" y="968" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="normal">lệnh (phải CỤM như thật)</text>
<text x="380.0" y="988" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="normal">Walk-forward 2 nửa · REGIME_LOCKED: mốc cấu trúc</text>
<text x="380.0" y="1005" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="normal">đăng ký trước (1971, 1987, 2000, 2008…)</text>
<text x="380.0" y="1029" font-size="17" fill="#475569" text-anchor="middle" font-weight="normal">Edge chỉ sống sau một mốc → cần cơ chế</text>
<text x="380.0" y="1046" font-size="17" fill="#475569" text-anchor="middle" font-weight="normal">kinh tế + dữ liệu ngoài mẫu sau phát hiện</text>
